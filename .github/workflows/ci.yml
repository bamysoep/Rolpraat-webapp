name: CI

on:
  push:
    branches: [ "**" ]  # Run on any branch
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    
    - name: Run Ruff linter
      run: ruff check backend/ database/
    
    - name: Run Ruff formatter check
      run: ruff format --check backend/ database/

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create test .env file
      run: |
        echo "DATABASE_URL=postgresql+psycopg://test:test@localhost:5432/test?sslmode=disable" > .env
    
    - name: Run tests
      run: |
        PYTHONPATH=${{ github.workspace }} pytest backend/tests/ -v --tb=short
      continue-on-error: true  # Allow tests to fail if DB is not available

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify imports
      run: |
        PYTHONPATH=${{ github.workspace }} python -c "from backend.src.main import app; print('✓ Application imports successful')"
    
    - name: Check application structure
      run: |
        echo "Checking project structure..."
        test -d backend/src/modules/users && echo "✓ Users module exists"
        test -f database/models.py && echo "✓ Database models exist"
        test -f backend/src/main.py && echo "✓ Main application exists"
